// local.properties is no longer parsed here. flutter.versionCode / flutter.versionName
// come from the Flutter Gradle plugin, which reads pubspec.yaml, so the version lived in
// two places before and now lives in one.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // Required from AGP 8 on, and it replaces the `package` attribute that used to sit in
    // AndroidManifest.xml — AGP now fails the build if both are present.
    namespace = "com.example.loggi_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId = "com.example.loggi_app"
        // The abiFilters block that used to sit here listed five ABIs including the
        // long-dead "armeabi". It existed for AMap's native libraries; AMap is gone and
        // Flutter selects ABIs itself, so filtering here only risked excluding one.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // The signingConfigs block that used to sit here pinned the debug keystore to
    // another developer's home directory (C:/Users/<someone-else>/.android/), so the
    // build failed for anyone else with "Keystore file not found". Its alias and
    // passwords were just Android's standard debug defaults, which means the block
    // was never adding anything: AGP's built-in debug config uses exactly those and
    // generates the keystore under the current user's home on first build.

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// The explicit kotlin-stdlib-jdk7 dependency is gone: the Kotlin Gradle plugin adds the
// stdlib matching its own version, and pinning it by hand is how a project ends up with
// a stdlib older than the compiler that produced its bytecode.
//
// The two com.amap.api artifacts (3dmap, search) were removed together with the AMap
// migration. They were declared as `latest.integration`, which is not a version but a
// moving target: it resolved to 3dmap 10.0.600 and search 9.7.1, two lines that ship the
// same classes, and the build died on `checkDebugDuplicateClasses`. So the Android build
// was already broken by them, and no Dart code referenced the search SDK at all.
