# Where the ARB files live and what gen-l10n produces from them.
#
# The app declared `flutter_localizations` and a `supportedLocales` list but shipped no ARB
# resources at all, which localises Flutter's own widgets and nothing else: every string the
# user reads was a Chinese literal in a build method.
arb-dir: lib/l10n
template-arb-file: app_zh.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
