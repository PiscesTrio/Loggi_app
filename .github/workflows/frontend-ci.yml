name: frontend-ci
on:
  push:
    branches: [ master, "slice/**" ]
  pull_request:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this migration was verified on, locally and on a device.
          # 'stable' would move under the repository without a commit, which is the exact
          # failure mode this project exists to demonstrate a fix for.
          flutter-version: '3.47.0'
          channel: stable
      # This workflow lives inside the Loggi_app repo, so the checkout root is the frontend project root.
      - run: flutter pub get
      - name: Analyze
        # The escape hatches are gone. S00 could only gate on errors because the repo carried
        # 481 infos; a bare `flutter analyze` defaults to fatal-infos and fatal-warnings, so it
        # would have failed on day one. The count is now zero, so the default IS the gate, and
        # the first new info fails the build instead of joining a pile nobody reads.
        run: flutter analyze
      - name: Test with coverage
        # This is the localisation gate as well as the test run. test/l10n asserts no CJK
        # literal outside three allowlisted files, matching key sets across zh/en/ja, no value
        # identical across languages, no kana in the Chinese file, no simplified-only forms in
        # the Japanese one, no unreferenced key, and matching placeholders. test/features adds
        # the layout check — every card rendered in every language, asserting nothing overflows
        # and nothing is silently clipped — and the error contract, which reads the code list
        # out of tool/openapi.json.
        #
        # Written as tests rather than as a CI script on purpose: a script here runs after the
        # push, and these run before it, on the machine of whoever broke them.
        run: flutter test --coverage
      - name: Check formatting
        # S00 omitted this because the repo carried unformatted code and it would have failed on
        # day one — the same reason `flutter analyze` had escape hatches then and does not now.
        # `dart format .` reports 0 changed across all 170 files, so the condition that comment
        # set has been met.
        run: dart format --set-exit-if-changed .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: coverage/lcov.info
