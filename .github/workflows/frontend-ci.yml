name: frontend-ci
on:
  push:
    branches: [ master, "slice/**" ]
  pull_request:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this migration was verified on, locally and on a device.
          # 'stable' would move under the repository without a commit, which is the exact
          # failure mode this project exists to demonstrate a fix for.
          flutter-version: '3.47.0'
          channel: stable
      # This workflow lives inside the Loggi_app repo, so the checkout root is the frontend project root.
      - run: flutter pub get
      - name: Analyze
        # S00 gate: "no error, warnings acceptable". Unlike `dart analyze`, `flutter analyze`
        # defaults to fatal-infos/fatal-warnings=true, and this repo still has infos (0 error,
        # 0 warning), so a bare run always exits 1. With both flags passed, error-level issues
        # still exit 1 — exactly the gate. Zeroing the infos is the lint-tightening step.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test with coverage
        run: flutter test --coverage
      # S00 deliberately omits `dart format --set-exit-if-changed`: existing code is unformatted,
      # so it would always fail. Enable it once the frontend cleanup slice lands a format-only commit.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: coverage/lcov.info
