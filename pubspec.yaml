name: loggi_app
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # Dart 3. Coupled to the Android build-file migration in the same commit:
  # the declarative Flutter Gradle plugin only exists in current Flutter, and
  # current Flutter refuses the imperative form, so neither half can land alone.
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter


  get: ^4.7.3
  cached_network_image: ^3.4.1
  dio: ^5.11.0
  # Deliberately left on 1.x. 2.0.2 is available, but it pins the same
  # connectivity_plus ^4.0.2 — the dead line that forces the compileSdk override in
  # android/build.gradle — and was published three weeks after 1.0.4, after which
  # the package stopped. Crossing a major version of an abandoned package across
  # the 22 files that import it buys nothing when the plan is to replace it with a
  # hand-written Dio client.
  # 10.x is the first line that stopped applying the Kotlin Gradle Plugin itself.
  # Current Flutter warns about that today and will fail on it later.
  fluttertoast: ^10.0.0
  # Also the latest release, also stopped (2022). One file uses it.
  multi_select_flutter: ^4.1.3
  flutter_svg: ^2.3.0
  # 2.1.1 is the latest release; the package stopped in 2023. Nothing to upgrade
  # to — replacing it is the token-storage slice's job, not a version bump.
  get_storage: ^2.1.1
  # A pure-Dart renderer with no platform plugin, so it runs everywhere the app
  # builds, and its tiles need no API key. 4.x was pinned only because it was the
  # last line supporting Dart 2.19; that constraint is gone.
  flutter_map: ^8.3.1
  # Must be declared explicitly: flutter_map does not re-export it, so relying on
  # it transitively would repeat the amap_flutter_base mistake.
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  # Imported directly by the distribution form for DateFormat. It was only ever
  # present transitively through flutter_localizations, which is the same mistake
  # latlong2 is declared explicitly to avoid: a transitive package can disappear
  # when its parent's constraints change, and nothing warns you until it does.
  intl: any
  url_launcher: ^6.3.2
  # Runtime dependency, not a dev one: lib/main.dart imports driver_extension
  # so an agent can drive the app on a real device, and code under lib/ cannot
  # import a dev_dependency. The call site sits behind a
  # const bool.fromEnvironment guard, so any build that does not pass
  # --dart-define=ENABLE_FLUTTER_DRIVER=true compiles the branch away.
  flutter_driver:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: 9.2.4
  dio_smart_retry: ^7.0.1
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  copy_with_extension: ^17.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1
  # build_runner and freezed are coupled through `analyzer`, and their ranges do not
  # overlap: freezed 3.x wants analyzer >=9 <11, build_runner >=2.15.2 wants >=13.3.0.
  #
  # freezed is on a 4.0 prerelease because the stable line does not work here — measured,
  # not assumed. freezed 3.2.5 generates `const _X({final List<T>? xs})` for any model with
  # a collection field, and `final` on a constructor parameter is a syntax error in current
  # Dart. Five models, one of them (Available) has List fields, and its generated file does
  # not compile. That language change is why 3.x is capped at analyzer 10 in the first
  # place.
  #
  # The generator is a dev dependency and never ships; freezed_annotation, which does ship,
  # is stable. Swap both back — freezed to ^4.0.0 and build_runner up — once freezed 4 is
  # released. Tracked in Loggi_refactor/HANDOFF.md §7.
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  copy_with_extension_gen: ^17.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - lib/assets/images/male/
    - lib/assets/images/female/
    - lib/assets/map_icons/

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

 
  fonts:
    - family: Nunito
      fonts:
      - asset: lib/assets/fonts/Nunito/Nunito-Bold.ttf
      - asset: lib/assets/fonts/Nunito/Nunito-Light.ttf
      - asset: lib/assets/fonts/Nunito/Nunito-Regular.ttf

    - family: Open_Sans
      fonts:
      - asset: lib/assets/fonts/Open_Sans/OpenSans-Bold.ttf
      - asset: lib/assets/fonts/Open_Sans/OpenSans-Light.ttf
      - asset: lib/assets/fonts/Open_Sans/OpenSans-Regular.ttf
  
         

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
